<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCS Technology – Kaarka Shakhsiga (Hore)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ══════════════════════════════════════════
       RESET & BASE
    ══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      /* Page background matching the React app */
      background: #0F172A;
      font-family: 'Inter', sans-serif;
      padding: 48px 20px;
    }

    /* Subtle purple glow on page background */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 20%, rgba(124, 58, 237, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Page label */
    .page-label {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 100px;
      padding: 6px 18px;
      color: #A78BFA;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ══════════════════════════════════════════
       CARD SCENE — 3D perspective wrapper
       Modify: perspective value changes depth
    ══════════════════════════════════════════ */
    .card-scene {
      perspective: 1500px;
      width: 720px;
      height: 400px;
      max-width: 95vw;
      position: relative;
      z-index: 1;
    }

    /* ══════════════════════════════════════════
       CARD — The actual card element
       Modify: border-radius for roundness
                border for accent line color
                box-shadow for glow effect
    ══════════════════════════════════════════ */
    .card {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      /* ACCENT COLOR: rgba(0, 216, 246, 0.5) = Cyan */
      border: 1.5px solid rgba(0, 216, 246, 0.5);
      overflow: hidden;
      display: flex;
      position: relative;
      /* GLOW SHADOW: rgba(0, 216, 246, 0.45) = Cyan glow */
      box-shadow:
        0 25px 50px -15px rgba(0, 216, 246, 0.45),
        0 0 0 0 transparent;
      transition: box-shadow 0.4s ease, transform 0.4s ease;
      /* BACKGROUND: #090B11 = near-black with slight blue tint */
      background: #090B11;
    }
    .card:hover {
      box-shadow:
        0 40px 80px -20px rgba(0, 216, 246, 0.45),
        0 0 45px rgba(0, 216, 246, 0.45);
    }

    /* ══════════════════════════════════════════
       TECH GRID TEXTURE (dot grid overlay)
       Modify: backgroundSize for grid density
               opacity for visibility
    ══════════════════════════════════════════ */
    .card-grid-texture {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 16px 16px;
      opacity: 0.9;
      z-index: 1;
      pointer-events: none;
    }

    /* ══════════════════════════════════════════
       LEFT SIDE — Contact info panel
       Modify: flex value to resize left/right ratio
               padding for inner spacing
    ══════════════════════════════════════════ */
    .card-left {
      /* flex: 1.25 = left side is 55.5% of card width */
      flex: 1.25;
      padding: 38px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 3;
    }

    /* ── Brand / Logo Row ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Logo container box */
    .logo-box {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.95);
      /* ACCENT BORDER: #00D8F6 = Cyan */
      border: 1.5px solid #00D8F6;
      display: flex;
      align-items: center;
      justify-content: center;
      /* ACCENT GLOW: #00D8F6 = Cyan */
      box-shadow: 0 0 16px rgba(0, 216, 246, 0.6);
      overflow: hidden;
      flex-shrink: 0;
    }
    .logo-box img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    /* Brand name text */
    .brand-name {
      color: #FFFFFF;
      font-weight: 950;
      font-size: 22px;
      letter-spacing: 1px;
      line-height: 1;
    }

    /* Brand subtitle — ACCENT COLOR */
    .brand-sub {
      /* ACCENT COLOR: #00D8F6 = Cyan */
      color: #00D8F6;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Person Info Block ── */
    .person-info {
      display: flex;
      flex-direction: column;
    }

    /* Person name */
    .person-name {
      color: #FFFFFF;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      line-height: 1.1;
    }

    /* Person title — ACCENT COLOR */
    .person-title {
      /* ACCENT COLOR: #00D8F6 = Cyan */
      color: #00D8F6;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    /* Decorative divider bar — ACCENT COLOR */
    .person-divider {
      width: 44px;
      height: 4px;
      /* ACCENT COLOR: #00D8F6 = Cyan */
      background: #00D8F6;
      border-radius: 10px;
      /* ACCENT GLOW */
      box-shadow: 0 0 10px #00D8F6;
    }

    /* ── Contact List ── */
    .contacts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      /* SUBTEXT COLOR: #94A3B8 = slate-400 */
      color: #94A3B8;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.2s ease, transform 0.2s ease;
      cursor: default;
    }
    .contact-item:hover {
      color: #ffffff;
      transform: translateX(4px);
    }

    /* SVG icon wrapper */
    .contact-icon {
      /* ACCENT COLOR: #00D8F6 = Cyan — change to alter icon color */
      color: #00D8F6;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .contact-icon svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ══════════════════════════════════════════
       RIGHT SIDE — Photo panel with overlay
       Modify: flex value for panel width
               clip-path for the diagonal cut shape
    ══════════════════════════════════════════ */
    .card-right {
      /* flex: 0.95 = right panel is ~44.4% of card width */
      flex: 0.95;
      position: relative;
      /* BACKGROUND IMAGE: Tech/workspace photo from Unsplash */
      background-image: url('https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=800&fit=crop&auto=format');
      background-size: cover;
      background-position: center;
      /* Diagonal cut: polygon(left-top%, 100% 0, 100% 100%, 0% 100%, ...) */
      clip-path: polygon(15% 0%, 100% 0%, 100% 100%, 0% 100%, 12% 75%, 2% 50%, 20% 25%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 38px 32px;
      z-index: 2;
      transition: all 0.4s ease;
    }

    /* Color blend overlay — GRADIENT PANEL
       This tints the photo with brand colors
       Modify: gradient colors to change the color blend
    */
    .card-right-overlay {
      position: absolute;
      inset: 0;
      /* GRADIENT PANEL: purple → rose → cyan */
      background: linear-gradient(135deg,
        rgba(124, 92, 246, 0.85) 0%,
        rgba(225, 29, 72, 0.85) 50%,
        rgba(0, 216, 246, 0.85) 100%);
      mix-blend-mode: multiply;
      z-index: 1;
      pointer-events: none;
    }

    /* Glass shine effect on right panel */
    .card-right-shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 60%);
      z-index: 1;
      pointer-events: none;
    }

    /* QR code container — top right of photo panel */
    .qr-container {
      display: flex;
      justify-content: flex-end;
      z-index: 2;
      position: relative;
    }

    .qr-box {
      background: white;
      padding: 8px;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.35);
      border: 2px solid rgba(255,255,255,0.9);
      transition: transform 0.3s ease;
    }
    .card:hover .qr-box {
      transform: scale(1.05) rotate(1deg);
    }
    .qr-box img {
      width: 84px;
      height: 84px;
      display: block;
    }

    /* Scan label — bottom right */
    .scan-label {
      text-align: right;
      z-index: 2;
      position: relative;
    }
    .scan-label span {
      color: white;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 3px 8px rgba(0,0,0,0.6);
    }

    /* ══════════════════════════════════════════
       ACTION BUTTONS
       Modify: colors, padding, border-radius
    ══════════════════════════════════════════ */
    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
      font-family: 'Inter', sans-serif;
    }

    /* Primary button — purple gradient */
    .btn-primary {
      background: linear-gradient(135deg, #7C3AED, #4F46E5);
      color: white;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(124, 58, 237, 0.5);
    }

    /* Ghost button */
    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }

    /* Gold accent button */
    .btn-gold {
      background: rgba(245, 158, 11, 0.12);
      color: #F59E0B;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .btn-gold:hover {
      background: rgba(245, 158, 11, 0.2);
      transform: translateY(-2px);
    }

    /* ══════════════════════════════════════════
       RESPONSIVE — Mobile scaling
    ══════════════════════════════════════════ */
    @media (max-width: 760px) {
      .card-scene { height: 260px; }
      .card-left { padding: 22px 24px; }
      .person-name { font-size: 22px; }
      .person-title { font-size: 12px; margin-bottom: 10px; }
      .person-divider { width: 30px; height: 3px; }
      .brand-name { font-size: 16px; }
      .logo-box { width: 38px; height: 38px; border-radius: 10px; }
      .logo-box img { width: 26px; height: 26px; }
      .contact-item { font-size: 11px; gap: 8px; }
      .contacts { gap: 7px; }
      .qr-box img { width: 58px; height: 58px; }
      .scan-label span { font-size: 9px; letter-spacing: 1.5px; }
    }
  </style>
</head>
